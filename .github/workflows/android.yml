name: Build APK & Host Laptop
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Buat ikon dengan logo OutsiderDev
        run: |
          curl -fsSL --retry 3 https://outsiderdev.com/img/ico.png -o /tmp/logo.png || echo "Logo tidak terunduh, ikon dibuat tanpa lencana"
          pip install --quiet pillow
          python3 scripts/make_icons.py /tmp/logo.png
      - run: gradle -p android assembleRelease --no-daemon -PversionName=1.0.${{ github.run_number }} -PversionCode=${{ github.run_number }}
      - run: mv android/app/build/outputs/apk/release/app-release.apk OutsiderDrop.apk
      - uses: actions/upload-artifact@v4
        with: { name: OutsiderDrop-apk, path: OutsiderDrop.apk }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build host Windows & Linux (dengan percobaan ulang)
        run: |
          npm ci
          APP_VERSION=1.0.${{ github.run_number }} node scripts/icon-exe.js
          for i in 1 2 3; do
            npx pkg . --no-bytecode --public-packages "*" --public --compress GZip --out-path dist \
              -t node22-win-x64,node22-linux-x64,node22-linux-arm64 && exit 0
            echo "Percobaan $i gagal, ulangi..."; sleep 20
          done
          exit 1
      - name: Rilis otomatis
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OutsiderDrop v1.0.${{ github.run_number }}
          files: |
            OutsiderDrop.apk
            dist/*

  mac:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Buat ikon dengan logo OutsiderDev
        run: |
          curl -fsSL --retry 3 https://outsiderdev.com/img/ico.png -o /tmp/logo.png || echo "Logo tidak terunduh"
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 scripts/make_icons.py /tmp/logo.png
      - name: Build aplikasi Mac (.app)
        run: |
          npm ci
          for t in arm64 x64; do
            for i in 1 2 3; do
              npx pkg . --no-bytecode --public-packages "*" --public --compress GZip \
                -t node22-macos-$t -o dist/outsiderdrop-macos-$t && break
              echo "Percobaan $i gagal, ulangi..."; sleep 20
            done
          done
          ls -la dist
          V=1.0.${{ github.run_number }}
          mac/build-app.sh dist/outsiderdrop-macos-arm64 OutsiderDrop-Mac-AppleSilicon.zip $V
          mac/build-app.sh dist/outsiderdrop-macos-x64 OutsiderDrop-Mac-Intel.zip $V
      - name: Tambahkan ke rilis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            OutsiderDrop-Mac-AppleSilicon.zip
            OutsiderDrop-Mac-Intel.zip
